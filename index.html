<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journey Through Tuesdays, True or Nonsense?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --lav:#EBDCFB;
    --lav-mid:#C9A9EE;
    --grape:#7C4DB8;
    --grape-deep:#5B3690;
    --grape-soft:#EFE4FB;
    --peri:#B9C6F2;
    --sun:#2FB6C6;
    --ele:#A6B2BE;
    --ele-dark:#7E8B98;
    --ele-shadow:#5C6874;
    --tusk:#FFF4DC;
    --blush:#D7B8F2;
    --cone:#E4B36A;
    --cone-line:#C9954B;
    --scoop:#FBF3DF;
    --drizzle:#E4D2A6;
    --ink:#2E2440;
    --ink-soft:#655579;
    --card:#FFFBF3;
    --card-edge:#E9DCC7;
    --correct:#4FB878;
    --correct-soft:#DEF3E7;
    --nope:#DB9A34;
    --nope-soft:#FBEBCF;
    --star:#127E8F;
    --shadow:rgba(60,40,90,.22);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Nunito",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:radial-gradient(125% 85% at 50% 0%, var(--lav) 0%, var(--lav-mid) 40%, var(--grape) 78%, var(--peri) 100%);
    min-height:100%;
    display:flex;align-items:center;justify-content:center;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));
    overflow-x:hidden;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --lav:#2A2140;--lav-mid:#3A2A57;--grape:#5B3690;--peri:#2C3352;
      --card:#2C2340;--card-edge:#443659;--ink:#F3ECFB;--ink-soft:#C4B4DC;
      --grape-soft:#3A2C52;--correct-soft:#213A2C;--nope-soft:#3C2F16;--shadow:rgba(0,0,0,.45);
    }
  }
  .stage{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:2}

  .header{text-align:center;filter:drop-shadow(0 2px 0 rgba(0,0,0,.08))}
  .journey{
    display:inline-block;font-family:"Baloo 2",cursive;font-weight:700;
    font-size:clamp(15px,4.6vw,19px);color:#fff;background:var(--grape-deep);
    padding:5px 18px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.18);
  }
  .title{
    font-family:"Baloo 2",cursive;font-weight:800;line-height:.95;margin:12px 0 0;
    font-size:clamp(30px,9vw,44px);color:#fff;text-shadow:0 3px 0 var(--grape-deep);
  }
  .date-badge{
    display:inline-block;font-family:"Baloo 2",cursive;font-weight:700;
    font-size:clamp(13px,3.6vw,15px);color:var(--ink);background:var(--sun);
    padding:5px 16px;border-radius:999px;margin-top:12px;box-shadow:0 3px 0 rgba(0,0,0,.14);
  }
  .date-badge .date{color:var(--grape-deep)}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
  .chip{
    font-family:"Baloo 2",cursive;font-weight:700;font-size:12.5px;color:#fff;
    background:rgba(91,54,144,.55);padding:4px 11px;border-radius:999px;
    backdrop-filter:blur(2px);
  }

  .card{
    background:var(--card);border:3px solid var(--card-edge);border-radius:28px;
    padding:20px 18px 22px;box-shadow:0 16px 34px var(--shadow);position:relative;
  }

  .ele-wrap{display:flex;justify-content:center;margin-top:-62px;pointer-events:none}
  .ele{width:158px;height:auto;transform-origin:50% 90%}
  .bounce{animation:bounce .6s ease}
  .tilt{animation:tilt .6s ease}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-14px) rotate(-3deg)}60%{transform:translateY(-6px) rotate(2deg)}}
  @keyframes tilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
  .mouth-happy,.mouth-oops{display:none}
  .happy .mouth-happy{display:block}
  .happy .mouth-neutral{display:none}
  .oops .mouth-neutral{display:none}
  .oops .mouth-oops{display:block}

  .track{display:flex;justify-content:center;gap:5px;margin-top:6px;flex-wrap:wrap}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--card-edge);transition:background .2s,transform .2s}
  .dot.on{background:var(--grape)}
  .dot.now{transform:scale(1.5);background:var(--sun)}

  .score{display:flex;align-items:center;justify-content:center;gap:6px;
    font-family:"Baloo 2",cursive;font-weight:700;font-size:18px;margin-top:12px}
  .score .st{font-size:20px}

  .topic{
    text-align:center;font-family:"Baloo 2",cursive;font-weight:700;font-size:14px;
    color:var(--grape);background:var(--grape-soft);border-radius:999px;
    padding:4px 14px;display:inline-block;margin:14px auto 0;
  }
  .topic-wrap{text-align:center}
  .fact{
    font-family:"Baloo 2",cursive;font-weight:600;font-size:clamp(20px,5.4vw,24px);
    line-height:1.25;text-align:center;color:var(--ink);margin:10px 6px 4px;
    min-height:3em;display:flex;align-items:center;justify-content:center;
  }

  .btns{display:flex;gap:12px;margin-top:12px}
  .btn{
    flex:1;border:none;cursor:pointer;font-family:"Baloo 2",cursive;font-weight:800;
    font-size:22px;color:#fff;padding:18px 8px;border-radius:20px;
    transition:transform .08s ease;box-shadow:0 6px 0 rgba(0,0,0,.18);
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .btn.true{background:var(--correct)}
  .btn.false{background:var(--grape)}
  .btn:disabled{cursor:default;opacity:.55}

  .verdict{margin-top:16px;border-radius:18px;padding:14px;text-align:center;display:none}
  .verdict.show{display:block;animation:pop .35s ease}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .verdict.right{background:var(--correct-soft)}
  .verdict.nope{background:var(--nope-soft)}
  .verdict h3{margin:0 0 6px;font-family:"Baloo 2",cursive;font-size:20px}
  .verdict.right h3{color:var(--correct)}
  .verdict.nope h3{color:var(--nope)}
  .verdict p{margin:0;font-weight:700;color:var(--ink-soft);font-size:15.5px;line-height:1.4}

  .next{
    margin-top:14px;width:100%;border:none;cursor:pointer;display:none;
    font-family:"Baloo 2",cursive;font-weight:800;font-size:19px;color:var(--ink);
    background:var(--sun);padding:15px;border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.15);transition:transform .08s;
  }
  .next:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
  .next.show{display:block;animation:pop .35s ease}

  .end{display:none;text-align:center}
  .end.show{display:block}
  .end h2{font-family:"Baloo 2",cursive;font-size:26px;margin:6px 0 4px;color:var(--grape)}
  .end .big{font-family:"Baloo 2",cursive;font-weight:800;font-size:52px;color:var(--star);margin:6px 0}
  .end p{font-weight:700;color:var(--ink-soft);font-size:16px;margin:4px 12px 0;line-height:1.45}
  .again{
    margin-top:18px;border:none;cursor:pointer;font-family:"Baloo 2",cursive;font-weight:800;
    font-size:20px;color:#fff;background:var(--grape);padding:15px 26px;border-radius:18px;
    box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .08s;
  }
  .again:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}

  .photo{
    display:block;margin:4px auto 0;width:min(60%,210px);height:auto;
    filter:drop-shadow(0 8px 12px rgba(46,30,70,.4));
  }
  .nav{display:flex;gap:8px;justify-content:center;margin-top:2px}
  .navbtn{
    font-family:"Baloo 2",cursive;font-weight:700;font-size:14px;cursor:pointer;
    border:none;border-radius:999px;padding:8px 16px;color:#fff;
    background:rgba(91,54,144,.5);box-shadow:0 3px 0 rgba(0,0,0,.15);transition:transform .08s;
  }
  .navbtn.active{background:var(--sun);color:var(--ink)}
  .navbtn:active{transform:translateY(2px)}
  .story-title{font-family:"Baloo 2",cursive;text-align:center;color:var(--grape);
    font-size:clamp(20px,5.6vw,26px);margin:2px 0 2px}
  .scene{width:100%;border-radius:18px;background:linear-gradient(180deg,#F3ECFB,#E7DBFA);
    overflow:hidden;margin-top:8px;border:2px solid var(--card-edge)}
  .scene svg{display:block;width:100%;height:auto}
  .story-text{font-family:"Baloo 2",cursive;font-weight:500;font-size:clamp(16px,4.4vw,18.5px);
    line-height:1.45;color:var(--ink);text-align:center;margin:14px 6px 4px;min-height:5em;
    display:flex;align-items:center;justify-content:center}
  .story-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
  .snav{font-family:"Baloo 2",cursive;font-weight:800;font-size:16px;cursor:pointer;border:none;
    border-radius:16px;padding:13px 18px;color:#fff;background:var(--grape);
    box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s}
  #nextPage{background:var(--correct)}
  .snav:active{transform:translateY(3px)}
  .snav:disabled{opacity:.4;cursor:default}
  .pagenum{font-family:"Baloo 2",cursive;font-weight:700;color:var(--ink-soft);font-size:14px}
  .footer{
    text-align:center;font-family:"Baloo 2",cursive;font-weight:700;
    font-size:clamp(13px,3.8vw,15.5px);color:#fff;margin-top:2px;
    text-shadow:0 2px 0 var(--grape-deep);
  }
  .bit{position:fixed;top:-30px;font-size:22px;z-index:5;pointer-events:none;will-change:transform}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

  @media (prefers-reduced-motion: reduce){
    .bounce,.tilt,.verdict.show,.next.show{animation:none}.bit{display:none}
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="header">
      <span class="journey">Journey Through Tuesdays</span>
      <h1 class="title">True or Nonsense?</h1>
      <span class="date-badge">🎉 Three holidays today <span class="date">· 9/22</span></span>
      <div class="chips">
        <span class="chip">🐘 Elephant Appreciation</span>
        <span class="chip">🍦 Ice Cream Cone</span>
        <span class="chip">🍫 White Chocolate</span>
      </div>
    </div>

    <div class="nav">
      <button class="navbtn active" id="tabGame">🎮 Play the Game</button>
      <button class="navbtn" id="tabStory">📖 Read the Story</button>
    </div>
    <div class="card" id="gameCard">
      <div class="ele-wrap">
        <svg id="ele" class="ele" viewBox="0 0 200 190" role="img" aria-label="A friendly cartoon elephant holding a white chocolate ice cream cone">
          <ellipse cx="100" cy="176" rx="54" ry="9" fill="rgba(0,0,0,.10)"/>
          <path d="M55 70 C10 55 8 110 40 118 C58 122 62 96 62 84 Z" fill="var(--ele-dark)"/>
          <path d="M145 70 C190 55 192 110 160 118 C142 122 138 96 138 84 Z" fill="var(--ele-dark)"/>
          <path d="M100 30 C142 30 158 62 158 95 C158 132 132 150 100 150 C68 150 42 132 42 95 C42 62 58 30 100 30 Z" fill="var(--ele)"/>
          <!-- trunk curls to hold the cone -->
          <path d="M100 96 C90 108 86 128 92 144 C96 154 108 156 116 150" fill="none" stroke="var(--ele)" stroke-width="20" stroke-linecap="round"/>
          <path d="M84 132 c-6 8 -6 16 -2 22" fill="none" stroke="var(--tusk)" stroke-width="7" stroke-linecap="round"/>
          <path d="M116 132 c6 8 6 16 2 22" fill="none" stroke="var(--tusk)" stroke-width="7" stroke-linecap="round"/>
          <circle cx="80" cy="88" r="9" fill="#fff"/>
          <circle cx="120" cy="88" r="9" fill="#fff"/>
          <circle cx="82" cy="90" r="4.5" fill="var(--ink)"/>
          <circle cx="118" cy="90" r="4.5" fill="var(--ink)"/>
          <circle cx="66" cy="104" r="7" fill="var(--blush)" opacity=".7"/>
          <circle cx="134" cy="104" r="7" fill="var(--blush)" opacity=".7"/>
          <path class="mouth-neutral" d="M92 116 q8 5 16 0" fill="none" stroke="var(--ele-shadow)" stroke-width="3" stroke-linecap="round"/>
          <path class="mouth-happy" d="M88 114 q12 12 24 0" fill="none" stroke="var(--ele-shadow)" stroke-width="3.5" stroke-linecap="round"/>
          <path class="mouth-oops" d="M90 118 q10 -6 20 0" fill="none" stroke="var(--ele-shadow)" stroke-width="3" stroke-linecap="round"/>
          <!-- ice cream cone (white chocolate scoop) held by the trunk -->
          <g>
            <path d="M108 158 L128 158 L118 186 Z" fill="var(--cone)"/>
            <path d="M112 164 L120 172 M118 160 L124 166" stroke="var(--cone-line)" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="118" cy="152" r="13" fill="var(--scoop)"/>
            <path d="M108 150 q5 5 10 0 q5 -5 10 0" fill="none" stroke="var(--drizzle)" stroke-width="2.4" stroke-linecap="round"/>
            <circle cx="118" cy="140" r="2.4" fill="var(--drizzle)"/>
          </g>
        </svg>
      </div>

      <div id="game">
        <div class="track" id="track"></div>
        <div class="score">Stars: <span class="st">⭐</span><span id="scoreNum">0</span></div>
        <div class="topic-wrap"><span class="topic" id="topic">🐘 Elephants</span></div>
        <div class="fact" id="fact">Loading a fact…</div>
        <div class="btns">
          <button class="btn true" id="btnTrue">TRUE</button>
          <button class="btn false" id="btnFalse">NONSENSE</button>
        </div>
        <div class="verdict" id="verdict">
          <h3 id="verdictTitle"></h3>
          <p id="verdictText"></p>
        </div>
        <button class="next" id="next">Next fact →</button>
      </div>

      <div class="end" id="end">
        <h2 id="endTitle">You did it!</h2>
        <div class="big"><span id="finalScore">0</span> ⭐</div>
        <p id="endMsg"></p>
        <button class="again" id="again">Play again</button>
      </div>
    </div>

    <div class="card story" id="storyCard" style="display:none">
      <h2 class="story-title">Journey &amp; Peanut's Best Tuesday</h2>
      <div class="scene" id="scene"></div>
      <p class="story-text" id="storyText"></p>
      <div class="track" id="storyDots"></div>
      <div class="story-nav">
        <button class="snav prev" id="prevPage">← Back</button>
        <span class="pagenum" id="pageNum"></span>
        <button class="snav" id="nextPage">Next →</button>
      </div>

<script>
const FACTS = [
  {topic:"🐘 Elephants", emoji:"🐘", t:true,  q:"Elephants are the only animal that can't jump.",
   why:"True! Their heavy legs just aren't built for hopping. All four feet stay on the ground."},
  {topic:"🍦 Ice Cream Cones", emoji:"🍦", t:true, q:"The ice cream cone became super popular at a World's Fair over 100 years ago.",
   why:"True! At a fair way back in 1904, a treat-seller rolled up waffles to hold ice cream, and cones took off!"},
  {topic:"🍫 White Chocolate", emoji:"🍫", t:false, q:"White chocolate is white because someone freezes it.",
   why:"Nonsense! It's naturally creamy-colored because it has no brown cocoa powder in it."},
  {topic:"🐘 Elephants", emoji:"🐘", t:false, q:"Elephants are so scared of tiny mice they run away.",
   why:"Nonsense! That's a made-up story. Mice don't scare elephants at all."},
  {topic:"🍦 Ice Cream Cones", emoji:"🍦", t:false, q:"The very first ice cream cones were made out of metal.",
   why:"Nonsense! Cones are edible, made from baked waffle or wafer so you can eat the whole thing."},
  {topic:"🍫 White Chocolate", emoji:"🍫", t:true, q:"White chocolate comes from the same bean as brown chocolate.",
   why:"True! It's made from cocoa butter, which comes from the very same cacao bean."},
  {topic:"🐘 Elephants", emoji:"🐘", t:true, q:"Elephants say hello by wrapping their trunks together.",
   why:"True! It's like a hug or a handshake between elephant friends and family."},
  {topic:"🍦 Ice Cream Cones", emoji:"🍦", t:true, q:"You can eat the whole cone, including the crunchy part.",
   why:"True! The crunchy cone is baked and totally edible, no spoon needed."},
  {topic:"🍫 White Chocolate", emoji:"🍫", t:false, q:"White chocolate is made from crushed-up marshmallows.",
   why:"Nonsense! It's made from cocoa butter, sugar, and milk, no marshmallows involved."},
  {topic:"🐘 Elephants", emoji:"🐘", t:false, q:"Elephants hunt and eat meat, just like lions.",
   why:"Nonsense! Elephants only eat plants, grass, leaves, fruit and bark."},
  {topic:"🍦 Ice Cream Cones", emoji:"🍦", t:false, q:"Ice cream cones can only be eaten with a spoon.",
   why:"Nonsense! The whole point of a cone is that you hold it and lick it, no spoon!"},
  {topic:"🍫 White Chocolate", emoji:"🍫", t:true, q:"White chocolate has no cocoa powder, so it isn't brown like regular chocolate.",
   why:"True! Because it skips the brown cocoa solids, some people even argue it's not 'real' chocolate."},
  {topic:"🐘 Elephants", emoji:"🐘", t:true, q:"Elephants are the biggest animals that live on land.",
   why:"True! Nothing on land is bigger. A grown elephant can weigh more than a small truck."},
  {topic:"🐘 Elephants", emoji:"🐘", t:true, q:"An elephant's trunk can pick up something as tiny as a single blade of grass.",
   why:"True! The same trunk that lifts a heavy log can gently pick up one tiny blade of grass."},
  {topic:"🐘 Elephants", emoji:"🐘", t:true, q:"A newborn baby elephant can weigh as much as a grown-up person.",
   why:"True! Baby elephants are born big, often around 200 pounds, as heavy as a grown-up!"},
  {topic:"🐘 Elephants", emoji:"🐘", t:false, q:"Elephants sleep for 12 hours every single night.",
   why:"Nonsense! Elephants only nap a few hours a day, they're too busy eating and roaming."},
  {topic:"🐘 Elephants", emoji:"🐘", t:false, q:"Elephants are cold-blooded, like a lizard or a snake.",
   why:"Nonsense! Elephants are mammals, so they're warm-blooded, just like you and me."},
  {topic:"🐘 Elephants", emoji:"🐘", t:false, q:"A grown-up elephant is only about as big as a large dog.",
   why:"Nonsense! Elephants are HUGE, taller than a grown-up and heavier than a car."},
  {topic:"🐘 Elephants", emoji:"🐘", t:true, q:"Elephants cover themselves in mud and dust like sunscreen.",
   why:"True! A mud bath keeps their skin cool and protects it from the hot sun and bugs."},
  {topic:"🐘 Elephants", emoji:"🐘", t:true, q:"Elephants can feel faraway sounds through their feet.",
   why:"True! They sense rumbles in the ground through their feet and can 'hear' friends far away."}
];

const $ = id => document.getElementById(id);
const ele=$('ele'),track=$('track'),topic=$('topic'),fact=$('fact'),
      btnTrue=$('btnTrue'),btnFalse=$('btnFalse'),
      verdict=$('verdict'),vTitle=$('verdictTitle'),vText=$('verdictText'),
      nextBtn=$('next'),game=$('game'),end=$('end'),
      scoreNum=$('scoreNum'),finalScore=$('finalScore'),
      endTitle=$('endTitle'),endMsg=$('endMsg'),again=$('again');

let i=0,score=0,order=[];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const RIGHT=["Yes! 🎉","Nice one! ⭐","You got it! 🌟","Woohoo! 🎉"];
const NOPE =["Good try! 💪","Almost! 🤔","Tricky one! 🌟","Nice guess! 💜"];

function shuffle(a){for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]];}return a;}
function buildTrack(){track.innerHTML='';order.forEach((_,n)=>{const d=document.createElement('div');d.className='dot'+(n<i?' on':'')+(n===i?' now':'');track.appendChild(d);});}

function start(){i=0;score=0;order=shuffle([...Array(FACTS.length).keys()]).slice(0,12);scoreNum.textContent='0';end.classList.remove('show');game.style.display='block';render();}
function render(){buildTrack();const f=FACTS[order[i]];topic.textContent=f.topic;fact.textContent=f.q;verdict.className='verdict';nextBtn.classList.remove('show');btnTrue.disabled=false;btnFalse.disabled=false;setFace('');}
function setFace(m){ele.className='ele'+(m?' '+m:'');}

function answer(said){
  const f=FACTS[order[i]];const correct=(said===f.t);
  btnTrue.disabled=true;btnFalse.disabled=true;
  verdict.classList.add('show',correct?'right':'nope');
  if(correct){
    score++;scoreNum.textContent=score;
    vTitle.textContent=RIGHT[Math.floor(Math.random()*RIGHT.length)];
    setFace('happy');ele.classList.add('bounce');
    rain([f.emoji,'⭐','🎉','💜']);
  }else{
    vTitle.textContent=NOPE[Math.floor(Math.random()*NOPE.length)];
    setFace('oops');ele.classList.add('tilt');
  }
  vText.textContent=f.why;
  setTimeout(()=>ele.classList.remove('bounce','tilt'),650);
  nextBtn.textContent=(i>=order.length-1)?"See my stars! ⭐":"Next fact →";
  nextBtn.classList.add('show');
}
function next(){i++;if(i>=order.length){finish();return;}render();}
function finish(){
  game.style.display='none';end.classList.add('show');finalScore.textContent=score;setFace('happy');
  const n=order.length;
  if(score===n){endTitle.textContent="Trivia Champion! 🏆";endMsg.textContent="A perfect score across elephants, cones, AND white chocolate. Amazing!";rain(['🐘','🍦','🍫','⭐','🏆']);}
  else if(score>=n*0.7){endTitle.textContent="Amazing work! 🌟";endMsg.textContent="You collected a big pile of stars. So many great answers!";rain(['🐘','🍦','🍫','⭐']);}
  else if(score>=n*0.4){endTitle.textContent="Nice job! 🎉";endMsg.textContent="You learned some cool facts today. Play again to grab even more stars!";}
  else{endTitle.textContent="Good start! 💪";endMsg.textContent="These were tricky! Give it another go and see how many stars you can collect.";}
}
function rain(set){
  if(reduce) return;
  for(let n=0;n<18;n++){
    const b=document.createElement('div');b.className='bit';b.textContent=set[Math.floor(Math.random()*set.length)];
    b.style.left=Math.random()*100+'vw';
    const dur=(2+Math.random()*1.5).toFixed(2);
    b.style.animation=`fall ${dur}s linear ${(Math.random()*0.4).toFixed(2)}s forwards`;
    document.body.appendChild(b);setTimeout(()=>b.remove(),(parseFloat(dur)+1)*1000);
  }
}
btnTrue.addEventListener('click',()=>answer(true));
btnFalse.addEventListener('click',()=>answer(false));
nextBtn.addEventListener('click',next);
again.addEventListener('click',start);
start();

/* ===================== STORY MODE ===================== */
const tabGame=$('tabGame'),tabStory=$('tabStory'),gameCard=$('gameCard'),storyCard=$('storyCard');
const scene=$('scene'),storyText=$('storyText'),storyDots=$('storyDots'),
      prevPage=$('prevPage'),nextPage=$('nextPage'),pageNum=$('pageNum');

const C={skin:'#6E4B2A',skinD:'#4E3419',dress:'#D9BEF2',dressD:'#B98FE0',bow:'#7C4DB8',
  hair:'#241a12',ele:'#A6B2BE',eleD:'#7E8B98',eleS:'#5C6874',tusk:'#FFF4DC',
  cone:'#E4B36A',coneL:'#C9954B',scoop:'#FBF3DF',drz:'#E4D2A6'};

function coneSVG(x,y,s){return `<g transform="translate(${x},${y}) scale(${s})">
  <path d="M-9 0 L9 0 L0 26 Z" fill="${C.cone}"/>
  <path d="M-4 7 L3 14 M3 4 L9 11" stroke="${C.coneL}" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="0" cy="-4" r="11" fill="${C.scoop}"/>
  <path d="M-8 -5 q4 4 8 0 q4 -4 8 0" fill="none" stroke="${C.drz}" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="0" cy="-13" r="2" fill="${C.drz}"/></g>`;}

function elephant(tx,ty,s,pose){
  const up=(pose==='wave'||pose==='excited'||pose==='trumpet'||pose==='cone');
  let trunk;
  if(pose==='cone') trunk=`<path d="M12 50 q-15 -6 -9 -26" fill="none" stroke="${C.ele}" stroke-width="11" stroke-linecap="round"/>`+coneSVG(2,16,0.8);
  else if(up) trunk=`<path d="M12 50 q-16 -4 -10 -26" fill="none" stroke="${C.ele}" stroke-width="11" stroke-linecap="round"/>`;
  else trunk=`<path d="M12 50 q-7 16 3 23" fill="none" stroke="${C.ele}" stroke-width="11" stroke-linecap="round"/>`;
  const ear=(pose==='excited'||pose==='trumpet')?24:31;
  return `<g transform="translate(${tx},${ty}) scale(${s})">
   <ellipse cx="55" cy="84" rx="45" ry="7" fill="rgba(60,40,90,.10)"/>
   <rect x="30" y="60" width="12" height="24" rx="6" fill="${C.eleD}"/>
   <rect x="68" y="60" width="12" height="24" rx="6" fill="${C.eleD}"/>
   <ellipse cx="58" cy="44" rx="42" ry="31" fill="${C.ele}"/>
   <rect x="46" y="60" width="12" height="24" rx="6" fill="${C.ele}"/>
   <rect x="80" y="60" width="12" height="24" rx="6" fill="${C.ele}"/>
   <circle cx="24" cy="42" r="24" fill="${C.ele}"/>
   <ellipse cx="30" cy="${ear}" rx="14" ry="16" fill="${C.eleD}"/>
   ${trunk}
   <circle cx="17" cy="40" r="7" fill="#fff"/><circle cx="16" cy="41" r="3.4" fill="${C.eleS}"/>
   <path d="M15 56 c-5 6 -5 12 -1 15" stroke="${C.tusk}" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>`;
}

function girl(tx,ty,s,pose){
  let rArm,lArm,cone='';
  if(pose==='wave'||pose==='point'){
    rArm=`<path d="M36 42 q10 -6 13 -20" stroke="${C.skin}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
    lArm=`<path d="M16 42 q-7 8 -7 18" stroke="${C.skin}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  } else if(pose==='cone'){
    rArm=`<path d="M36 42 q9 -8 15 -18" stroke="${C.skin}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
    lArm=`<path d="M16 42 q-7 8 -7 18" stroke="${C.skin}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
    cone=coneSVG(53,20,0.7);
  } else if(pose==='hug'){
    rArm=`<path d="M36 42 q18 0 32 6" stroke="${C.skin}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
    lArm=`<path d="M16 44 q16 6 30 9" stroke="${C.skin}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  } else {
    rArm=`<path d="M36 42 q8 8 8 18" stroke="${C.skin}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
    lArm=`<path d="M16 42 q-8 8 -8 18" stroke="${C.skin}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  }
  return `<g transform="translate(${tx},${ty}) scale(${s})">
   <ellipse cx="26" cy="93" rx="20" ry="5" fill="rgba(60,40,90,.10)"/>
   <path d="M21 62 L19 90" stroke="${C.skin}" stroke-width="6" stroke-linecap="round"/>
   <path d="M31 62 L33 90" stroke="${C.skin}" stroke-width="6" stroke-linecap="round"/>
   <ellipse cx="18" cy="91" rx="6" ry="3.6" fill="#E7C05A"/>
   <ellipse cx="34" cy="91" rx="6" ry="3.6" fill="#E7C05A"/>
   <polygon points="16,34 36,34 44,66 8,66" fill="${C.dress}"/>
   <circle cx="26" cy="52" r="6" fill="${C.dressD}"/>
   <circle cx="18" cy="60" r="3.4" fill="${C.dressD}"/><circle cx="34" cy="60" r="3.4" fill="${C.dressD}"/>
   ${lArm}${rArm}${cone}
   <circle cx="26" cy="16" r="14" fill="${C.hair}"/>
   <circle cx="26" cy="18" r="12.5" fill="${C.skin}"/>
   <circle cx="12" cy="21" r="6.5" fill="${C.hair}"/><circle cx="40" cy="21" r="6.5" fill="${C.hair}"/>
   <polygon points="19,3 26,9 33,3 33,9 26,12 19,9" fill="${C.bow}"/>
   <circle cx="26" cy="6" r="2.6" fill="${C.bow}"/>
   <path d="M18 17 q3 3 6 0" stroke="${C.skinD}" stroke-width="2" fill="none" stroke-linecap="round"/>
   <path d="M28 17 q3 3 6 0" stroke="${C.skinD}" stroke-width="2" fill="none" stroke-linecap="round"/>
   <path d="M19 23 q7 5 14 0" stroke="${C.skinD}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>`;
}

function svgWrap(inner){
  return `<svg viewBox="0 0 320 205" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="180" width="320" height="25" fill="rgba(124,77,184,.14)"/>
    ${inner}</svg>`;
}

const STORY = [
  `One bright Tuesday morning, Journey opened her front door, and there stood a little elephant! He wiggled his trunk and gave a happy "Prrp!" "Hello!" laughed Journey. "I'm Journey. What's your name?" "I'm Peanut," said the elephant, flapping his big ears.`,
  `"Guess what, Peanut? Today is a SUPER special Tuesday," said Journey. "It's Elephant Appreciation Day, Ice Cream Cone Day, AND White Chocolate Day, all at once!" Peanut's eyes went wide. A whole day for elephants AND ice cream? Best. Day. Ever.`,
  `"Then there's no time to lose!" Peanut knelt down low. Journey climbed onto his big soft back and held on to his ears. Clip-clomp, clip-clomp, off they went, all the way to the ice cream shop.`,
  `Journey picked a scoop of creamy white chocolate ice cream in a crunchy golden cone. Peanut wanted one too... make that THREE scoops, stacked all the way up! The man at the shop had never served an elephant before, and he grinned the whole time.`,
  `On the walk home, a little drip slid down Journey's cone. Oh no! But quick as a wink, Peanut curled his trunk and caught the drip before it could hit the ground. They laughed and laughed until their bellies hurt.`,
  `When the sky turned golden, Journey wrapped her arms around Peanut in a great big hug. "Same time next Tuesday?" she asked. Peanut lifted his trunk and trumpeted the happiest YES in the whole world. And it truly was, the very best Tuesday twogether. \u2728`
];

const SCENES = [
  ()=> elephant(172,90,1.15,'wave') + girl(58,80,1.05,'wave'),
  ()=> elephant(172,90,1.15,'excited') + girl(58,80,1.05,'point'),
  ()=> elephant(108,98,1.32,'walk') + girl(150,50,0.72,'wave'),
  ()=> elephant(176,92,1.08,'cone') + girl(58,82,1.05,'cone'),
  ()=> elephant(176,92,1.08,'cone') + girl(58,82,1.05,'cone')
        + `<text x="112" y="70" font-size="20">😂</text><text x="150" y="150" font-size="16">💧</text><text x="30" y="52" font-size="15">✨</text>`,
  ()=> `<circle cx="276" cy="44" r="30" fill="#66C9D6" opacity=".85"/><text x="40" y="48" font-size="16">✨</text>`
        + elephant(172,92,1.08,'trumpet') + girl(94,82,1.02,'hug')
];

let page=0;
function renderStory(){
  scene.innerHTML = svgWrap(SCENES[page]());
  storyText.textContent = STORY[page];
  pageNum.textContent = `${page+1} / ${STORY.length}`;
  prevPage.disabled = page===0;
  nextPage.textContent = page===STORY.length-1 ? 'The End 🎉' : 'Next →';
  storyDots.innerHTML='';
  STORY.forEach((_,n)=>{const d=document.createElement('div');
    d.className='dot'+(n<page?' on':'')+(n===page?' now':'');storyDots.appendChild(d);});
}
prevPage.addEventListener('click',()=>{if(page>0){page--;renderStory();}});
nextPage.addEventListener('click',()=>{
  if(page<STORY.length-1){page++;renderStory();}
  else{rain(['🐘','🍦','💜','⭐','✨']);}
});
tabGame.addEventListener('click',()=>{
  gameCard.style.display='block';storyCard.style.display='none';
  tabGame.classList.add('active');tabStory.classList.remove('active');
});
tabStory.addEventListener('click',()=>{
  gameCard.style.display='none';storyCard.style.display='block';
  tabStory.classList.add('active');tabGame.classList.remove('active');
  if(!scene.innerHTML) renderStory();
});

</script>
</body>
